<text x="240" y="69" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0b0b0b">build A: seeds 0, 1, 2, ..., 99 (all timed back to back)</text>
<rect x="470" y="50" width="420" height="30" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="680" y="69" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0b0b0b">build B: seeds 0, 1, 2, ..., 99</text>
