<rect x="0" y="0" width="960" height="355" fill="#fcfcfb"/>
<text x="30" y="34" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#0b0b0b" font-weight="bold">Current quality timing, one case:</text>
