<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 355" width="960" height="355" role="img" aria-label="Runtime measurement: the current protocol times all seeds of one build and then the other; the proposed protocol times balanced blocks that each contain all four arms with arm-specific seeds, warm-up outside the timed region, and an A/A control.">
<title>Runtime measurement: the current protocol times all seeds of one build and then the other; the proposed protocol times balanced blocks that each contain all four arms with arm-specific seeds, warm-up outside the timed region, and an A/A control.</title>
