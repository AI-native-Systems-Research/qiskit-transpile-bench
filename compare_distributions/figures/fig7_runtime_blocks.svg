<text x="30" y="256" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e"><tspan x="30" dy="0">time; each arm sits once in every block position within each group of four blocks, and the order within that constraint is randomized.</tspan><tspan x="30" dy="15">Repeat in independent sessions; each arm has its own 100-seed list. Compare arm means, not block ratios.</tspan><tspan x="30" dy="15">Resample complete sessions across the fixed panel (section 7); runtime CIs condition on the frozen seed lists.</tspan></text>
<text x="30" y="333" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e">W = wait_time, D = decay, L = lookahead, B = basic</text>
