<line x1="480.0" y1="276" x2="480.0" y2="284" stroke="#52514e" stroke-width="1.2"/>
<text x="480.0" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#52514e">0</text>
