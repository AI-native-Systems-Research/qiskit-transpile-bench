<line x1="495.0" y1="164" x2="555.0" y2="164" stroke="#0b0b0b" stroke-width="2.2"/>
<line x1="495.0" y1="159" x2="495.0" y2="169" stroke="#0b0b0b" stroke-width="2"/>
<line x1="555.0" y1="159" x2="555.0" y2="169" stroke="#0b0b0b" stroke-width="2"/>
<rect x="520.5" y="159.5" width="9" height="9" rx="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>
<text x="616" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="start" fill="#52514e">entirely above: evidence for a wait-time regression</text>
<text x="280" y="220" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="end" fill="#0b0b0b">-5%  two intervals</text>
<line x1="340.5" y1="216" x2="471.0" y2="216" stroke="#2a78d6" stroke-width="1.2"/>
<line x1="340.5" y1="209" x2="340.5" y2="223" stroke="#2a78d6" stroke-width="1.2"/>
<line x1="471.0" y1="209" x2="471.0" y2="223" stroke="#2a78d6" stroke-width="1.2"/>
<text x="405.0" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0b0b0b">pointwise 95%: [-8%, -2%]</text>
<text x="405.0" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2a78d6">adjusted, m = 6: [-9.3%, -0.6%]</text>
<line x1="360.0" y1="216" x2="450.0" y2="216" stroke="#0b0b0b" stroke-width="2.2"/>
