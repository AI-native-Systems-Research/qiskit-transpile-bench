<line x1="570.0" y1="276" x2="570.0" y2="284" stroke="#52514e" stroke-width="1.2"/>
<text x="570.0" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#52514e">+6%</text>
<line x1="600.0" y1="276" x2="600.0" y2="284" stroke="#52514e" stroke-width="1.2"/>
