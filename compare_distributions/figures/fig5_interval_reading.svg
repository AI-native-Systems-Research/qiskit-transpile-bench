<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Reading a mean-ratio confidence interval against the no-change reference: entirely below favors wait time, crossing is unresolved, entirely above is a regression; an adjusted interval is wider than the pointwise one for the same estimate.">
<title>Reading a mean-ratio confidence interval against the no-change reference: entirely below favors wait time, crossing is unresolved, entirely above is a regression; an adjusted interval is wider than the pointwise one for the same estimate.</title>
