<text x="480.0" y="573.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e34948"><tspan x="480.0" dy="0">Activation check: inspect the actual pass trace</tspan><tspan x="480.0" dy="18">Default SabreLayout may route internally, causing CheckMap to skip routing.</tspan><tspan x="480.0" dy="18">Replacing only pm.routing can leave the selected preset with no work.</tspan></text>
