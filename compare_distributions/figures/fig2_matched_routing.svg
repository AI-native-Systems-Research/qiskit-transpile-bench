<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-label="Controlled routing: one fixed prepared input and applied layout per case, 100 independent routing seeds per arm, and identical downstream passes.">
<title>Controlled routing: one fixed prepared input and applied layout per case, 100 independent routing seeds per arm, and identical downstream passes.</title>
