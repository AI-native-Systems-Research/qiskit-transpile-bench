<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-label="Analytic confidence intervals for the mean ratio: use each independent arm's sample mean and variance, propagate uncertainty on the log scale, combine case variances with squared fixed weights, and exponentiate the interval.">
<title>Analytic confidence intervals for the mean ratio: use each independent arm's sample mean and variance, propagate uncertainty on the log scale, combine case variances with squared fixed weights, and exponentiate the interval.</title>
<defs><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#52514e"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a78d6"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#eb6834"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#e34948"/></marker></defs>
<rect x="0" y="0" width="960" height="620" fill="#fcfcfb"/>
<text x="480" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Analytic uncertainty for one mean comparison</text>
<text x="480" y="52" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52514e">Apply separately to D2 and N2, and to each of the three comparators</text>
<rect x="60" y="76" width="380" height="94" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="250.0" y="104.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="250.0" dy="0">wait_time</tspan><tspan x="250.0" dy="23">n = 100; sample mean m; sample SD s</tspan><tspan x="250.0" dy="23">v_W = s_W^2 / (100 * m_W^2)</tspan></text>
<line x1="250" y1="170" x2="250" y2="190" stroke="#52514e" stroke-width="1.2"/>
<rect x="520" y="76" width="380" height="94" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.2"/>
<text x="710.0" y="104.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="710.0" dy="0">comparator: decay, lookahead, or basic</tspan><tspan x="710.0" dy="23">n = 100; sample mean m; sample SD s</tspan><tspan x="710.0" dy="23">v_g = s_g^2 / (100 * m_g^2)</tspan></text>
<line x1="710" y1="170" x2="710" y2="190" stroke="#52514e" stroke-width="1.2"/>
<line x1="250" y1="190" x2="710" y2="190" stroke="#52514e" stroke-width="1.2"/>
<line x1="480" y1="190" x2="480" y2="214" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="100" y="216" width="760" height="76" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="480.0" y="238.68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0b0b0b"><tspan x="480.0" dy="0">Within each case: independent arm estimates</tspan><tspan x="480.0" dy="20">ell_c = log(m_W / m_g)</tspan><tspan x="480.0" dy="20">SE_case = sqrt(v_W + v_g)</tspan></text>
<line x1="480" y1="292" x2="480" y2="318" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="100" y="320" width="760" height="86" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="480.0" y="345.68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0b0b0b"><tspan x="480.0" dy="0">Across the fixed panel: use the frozen case weights w_c</tspan><tspan x="480.0" dy="22">L = sum_c w_c * ell_c</tspan><tspan x="480.0" dy="22">SE_panel = sqrt(sum_c w_c^2 * (v_W,c + v_g,c))</tspan></text>
<line x1="480" y1="406" x2="480" y2="432" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="100" y="434" width="760" height="82" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="480.0" y="457.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#0b0b0b"><tspan x="480.0" dy="0">Mean-ratio estimate R = exp(L)</tspan><tspan x="480.0" dy="22">Ratio CI = [exp(L - z * SE_panel), exp(L + z * SE_panel)]</tspan><tspan x="480.0" dy="22">Convert each endpoint to percentage change with 100 * (ratio - 1)</tspan></text>
<text x="480" y="546" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52514e"><tspan x="480" dy="0">Pointwise 95%: z = 1.960     |     Six-effect adjustment: z = 2.638</tspan><tspan x="480" dy="23">Approximate intervals; require positive means and independent case/arm samples.</tspan><tspan x="480" dy="23">The three contrasts share the same wait-time estimates and uncertainty.</tspan></text>
</svg>
