<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-label="Independent-arm bootstrap: independently resample 100 records within every case and arm, keep D2/N2 together, then compare summaries and reuse the wait-time resample for all three contrasts.">
