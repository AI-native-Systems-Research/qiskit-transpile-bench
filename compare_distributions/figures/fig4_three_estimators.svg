<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Summarize each independent arm distribution, then compare arithmetic means, P90s, and independently normalized SDs. No individual observations are matched.">
<title>Summarize each independent arm distribution, then compare arithmetic means, P90s, and independently normalized SDs. No individual observations are matched.</title>
<defs><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#52514e"/></marker><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a78d6"/></marker><marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#eb6834"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#e34948"/></marker></defs>
<rect x="0" y="0" width="960" height="540" fill="#fcfcfb"/>
<text x="480" y="30" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#0b0b0b" font-weight="bold">Summarize each distribution first; compare its summaries</text>
<rect x="50" y="54" width="390" height="55" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="245.0" y="78.68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0b0b0b"><tspan x="245.0" dy="0">wait_time: 100 observations</tspan><tspan x="245.0" dy="15">Independent routing seed list</tspan></text>
<rect x="520" y="54" width="390" height="55" rx="4" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.2"/>
<text x="715.0" y="78.68" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0b0b0b"><tspan x="715.0" dy="0">comparator: 100 observations</tspan><tspan x="715.0" dy="15">Independent routing seed list</tspan></text>
<text x="50" y="143" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0b0b0b" font-weight="bold">(a) Primary mean comparison</text>
<rect x="50" y="155" width="250" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="175.0" y="179.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="175.0" dy="0">Separate arm summaries</tspan><tspan x="175.0" dy="15">mean(W), mean(g)</tspan></text>
<line x1="300" y1="182" x2="340" y2="182" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="342" y="155" width="250" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="467.0" y="179.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="467.0" dy="0">One contrast per case</tspan><tspan x="467.0" dy="15">mean(W) / mean(g)</tspan></text>
<line x1="592" y1="182" x2="632" y2="182" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="634" y="155" width="276" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="772.0" y="179.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="772.0" dy="0">Weighted geometric mean</tspan><tspan x="772.0" dy="15">of case mean ratios</tspan></text>
<text x="50" y="263" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0b0b0b" font-weight="bold">(b) Upper-tail comparison</text>
<rect x="50" y="275" width="250" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="175.0" y="299.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="175.0" dy="0">Separate arm summaries</tspan><tspan x="175.0" dy="15">P90(W), P90(g)</tspan></text>
<line x1="300" y1="302" x2="340" y2="302" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="342" y="275" width="250" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="467.0" y="299.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="467.0" dy="0">One contrast per case</tspan><tspan x="467.0" dy="15">P90(W) / P90(g)</tspan></text>
<line x1="592" y1="302" x2="632" y2="302" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="634" y="275" width="276" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="772.0" y="299.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="772.0" dy="0">Weighted geometric mean</tspan><tspan x="772.0" dy="15">of case P90 ratios</tspan></text>
<text x="50" y="383" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#0b0b0b" font-weight="bold">(c) Relative-spread comparison</text>
<rect x="50" y="395" width="250" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="175.0" y="419.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="175.0" dy="0">Separate arm summaries</tspan><tspan x="175.0" dy="15">CV(W), CV(g)</tspan></text>
<line x1="300" y1="422" x2="340" y2="422" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="342" y="395" width="250" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="467.0" y="419.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="467.0" dy="0">One contrast per case</tspan><tspan x="467.0" dy="15">100 * (CV(W) - CV(g))</tspan></text>
<line x1="592" y1="422" x2="632" y2="422" stroke="#52514e" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
<rect x="634" y="395" width="276" height="55" rx="4" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="772.0" y="419.32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0b0b0b"><tspan x="772.0" dy="0">Weighted mean across cases</tspan><tspan x="772.0" dy="15">One CV difference + CI (pp)</tspan></text>
<text x="50" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#52514e"><tspan x="50" dy="0">CV = SD / own mean. IQR uses IQR / own median; median uses case ratios.</tspan><tspan x="50" dy="19">Each aggregate has a confidence interval. No per-run comparisons or rank matching.</tspan></text>
</svg>
